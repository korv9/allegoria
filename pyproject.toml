[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "allegoria"
version = "0.1.0"
description = "A Databricks legal-data product for meaning transformation experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.96",
    "beautifulsoup4==4.13.5",
    "lakehouse-engine[dq]==2.1.1",
]

[project.optional-dependencies]
dev = [
    "duckdb>=1.0",
    "lakehouse-engine[os]==2.1.1",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.4",
]

[project.scripts]
meaning-quality = "meaningquality.cli:main"

[tool.setuptools.packages.find]
include = ["products*", "simulacria*", "meaningquality*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
builtins = ["spark", "dbutils"]

# The Databricks product tree predates line-length = 100 and is wrapped at 88.
# It is frozen (see CLAUDE.md: "Do not delete it, do not 'improve' it"), so the
# formatter is not pointed at it -- a permanently red check is worse than no
# check. Linting still covers these files; only formatting is excluded.
# tests/test_allegoria_product.py is the test suite for that frozen tree and is
# wrapped to match it.
[tool.ruff.format]
exclude = [
    "products/allegoria/**",
    "tests/test_allegoria_product.py",
]
