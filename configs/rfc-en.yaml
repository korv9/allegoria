experiment: rfc-en
description: >-
  The same instrument on English technical norms: numbered RFC sections whose
  MUST / MUST NOT / SHOULD language carries duties, exceptions and conditions.
  It exists to show that the pipeline is not tied to Swedish statute; it is not
  a second study, and its results are not pooled with allegoria-sv.
language: en
generations: 10
corpora:
  - path: corpus/rfc_probe_v1.yaml
    styles: all
# Which models do the work. Names come from configs/models.yaml, which holds
# the prices, the parameters and what has actually been verified.
models:
  transformer: sonnet-5
  extractor: haiku-4-5
prompts: prompts/en/transform.yaml
reader_prompt: prompts/en/read_slots.txt
prediction: predictions/2026-09-12-rfc-domain.md
