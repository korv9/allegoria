bundle:
  name: allegoria

variables:
  catalog:
    description: Unity Catalog used by the Allegoria medallion tables.
    default: dev_lakehouse

resources:
  jobs:
    allegoria_medallion:
      name: "[${bundle.target}] allegoria_medallion"
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ./products/allegoria/setup_allegoria/notebook.py

        - task_key: bronze
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ./products/allegoria/bronze_allegoria/notebook.py
          libraries:
            - pypi:
                package: "lakehouse-engine[dq]==2.1.1"

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./products/allegoria/silver_allegoria/notebook.py
          libraries:
            - pypi:
                package: "lakehouse-engine[dq]==2.1.1"
            - pypi:
                package: "beautifulsoup4==4.13.5"

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./products/allegoria/gold_allegoria/notebook.py
          libraries:
            - pypi:
                package: "lakehouse-engine[dq]==2.1.1"

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
    variables:
      catalog: prod_lakehouse