bundle:
  name: allegoria

variables:
  catalog:
    description: Unity Catalog used by the Allegoria medallion tables.
    default: dev_lakehouse

resources:
  jobs:
    allegoria_sfs_medallion:
      name: "[${bundle.target}] allegoria_sfs_medallion"
      tasks:
        - task_key: setup_catalog
          notebook_task:
            notebook_path: ./products/allegoria/setup/setup_catalog.py

        - task_key: bronze_sfs
          depends_on:
            - task_key: setup_catalog
          notebook_task:
            notebook_path: ./products/allegoria/bronze/bronze_sfs.py

        - task_key: silver_sfs
          depends_on:
            - task_key: bronze_sfs
          notebook_task:
            notebook_path: ./products/allegoria/silver/silver_sfs.py

        - task_key: gold_sfs
          depends_on:
            - task_key: silver_sfs
          notebook_task:
            notebook_path: ./products/allegoria/gold/gold_sfs.py

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
    variables:
      catalog: prod_lakehouse
