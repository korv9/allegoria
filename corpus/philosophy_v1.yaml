- passage_id: categorical-04
  group: categorical
  pair_id: pair-04
  topic: redovisning
  text: En förvaltare ska redovisa de anförtrodda medlen sanningsenligt för huvudmannen. Plikten avser
    en redovisning som återger användningen av medlen och ger huvudmannen en riktig bild av förvaltningen.
    Redovisningen omfattar varje utgift. Detta gäller utan undantag, oberoende av egen fördel och av andras
    önskemål.
  text_sha256: 84868678e794d2b955160cce63a072ad865b08012da4548e4cb62985842d3b6e
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
