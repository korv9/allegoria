- passage_id: categorical-03
  group: categorical
  pair_id: pair-03
  topic: återlämnande
  text: En förvarare ska återlämna den anförtrodda egendomen till ägaren. Plikten avser samma föremål
    som förvararen tog emot och innebär ett faktiskt överlämnande till den person som äger föremålet.
    Detta gäller utan undantag, oberoende av egen fördel och av andras önskemål.
  text_sha256: 29fdd01afd86a4d9c51c8a591c8b02bbbe95464a9ade9a3344c2ad18e2171059
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
- passage_id: conditional-03
  group: conditional
  pair_id: pair-03
  topic: återlämnande
  text: En förvarare ska återlämna den anförtrodda egendomen till ägaren. Plikten avser samma föremål
