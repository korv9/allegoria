- passage_id: categorical-10
  group: categorical
  pair_id: pair-10
  topic: förtroende
  text: En förtroendeperson ska bevara den anförtrodda hemligheten. Plikten avser hemlighetens innehåll
    och omfattar dess återgivning i både tal och skrift inför andra personer än den som lämnade förtroendet.
    Förtroendet binder mottagaren genom dennes eget åtagande att bevara innehållet. Detta gäller utan
    undantag, oberoende av egen fördel och av andras önskemål.
  text_sha256: 2c9c9f1e5609e8f508b800480480803160e8100ca1dadd473611465b5cbecdfc
  source: constructed:2026-09-11; philosophical form, not quotation
