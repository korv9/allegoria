- passage_id: categorical-06
  group: categorical
  pair_id: pair-06
  topic: samtycke
  text: En undersökningsledare ska inhämta deltagarens fria samtycke till medverkan. Plikten avser deltagarens
    eget ställningstagande till den beskrivna undersökningen och dess användning av deltagarens uppgifter.
    Samtycket är deltagarens eget beslut. Detta gäller utan undantag, oberoende av egen fördel och av
    andras önskemål.
  text_sha256: 97e29598be2076f7fb22d5ec2fe83480ece71ee45ee43af4227062f8055d8035
  source: constructed:2026-09-11; philosophical form, not quotation
