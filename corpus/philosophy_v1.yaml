- passage_id: categorical-09
  group: categorical
  pair_id: pair-09
  topic: respekt
  text: En samtalsledare ska bemöta varje deltagare som en självständig person. Plikten avser ett bemötande
    som erkänner deltagarens egen vilja och ställning i samtalet, med samma respekt för varje deltagare.
    Deltagarens ställning grundas i dennes person och inte i nyttan för samtalsledaren. Detta gäller utan
    undantag, oberoende av egen fördel och av andras önskemål.
  text_sha256: b96194fcd0dec07c4e9eb6599b82c652dff302f461a16a554e87e001c2b5d4c3
  source: constructed:2026-09-11; philosophical form, not quotation
