- passage_id: virtue-01
  group: virtue
  pair_id: null
  topic: mod
  text: Den modiges hållning ligger mellan den feges undvikande och den dumdristiges likgiltighet inför
    fara. Rädslan har en plats i denna karaktär utan att fylla hela synfältet. Fastheten består i uppmärksamhet
    på faran och handlingens betydelse.
  text_sha256: 8155ee6e91bfbf06c03220bb285ef4c8d252f70bbb24a574f1f97fc69dd583d4
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
- passage_id: virtue-02
  group: virtue
  pair_id: null
  topic: måttfullhet
  text: Den måttfulles karaktär ligger mellan den utsvävandes upptagenhet av njutning och den känslolöses
    avstånd till all glädje. Begären ingår i ett sammanhang av vänskap, arbete och vila. Njutningen har
    ett värde utan att ensam bestämma personens sätt att leva.
  text_sha256: e3ff84aa629263b47d4e4eebd635c63fcf83c160baccc1073668d403dfcd34db
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
- passage_id: virtue-03
  group: virtue
  pair_id: null
  topic: generositet
  text: Den generöses hållning ligger mellan den giriges slutna hand och den slösaktiges likgiltighet
    inför tillgångarnas värde. Gåvan uttrycker uppmärksamhet på mottagaren och på det gemensamma livet.
    Egendomen är varken ett självändamål eller något helt betydelselöst.
  text_sha256: 1db920dd9d5c7d976594850d8ed347834169e8cf8c8c17df8a9c00ca722c2856
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
- passage_id: virtue-04
  group: virtue
  pair_id: null
  topic: sannfärdighet
  text: Den sannfärdiges karaktär ligger mellan skrytarens förstoring av den egna betydelsen och den självförringandes
    förnekelse av sina förmågor. Berättelsen har proportioner som svarar mot erfarenheten. Personen framträder
    med både sina förtjänster och sina begränsningar. Talet präglas av saklighet snarare än beräkning.
  text_sha256: c108e12971f629538fae29470517803fc92c46ac80761bb92c9cecab1e32a538
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
- passage_id: virtue-05
  group: virtue
  pair_id: null
  topic: vänlighet
  text: Den vänliges hållning ligger mellan den inställsammes ständiga bekräftelse och den grälsjukes
    sökande efter motsättningar. Samvaron rymmer värme och en tydlig egen röst. Intresset för andra vilar
    i en stadig karaktär och saknar beroende av deras omedelbara uppskattning. Oenighet ryms inom denna
    vänlighet.
  text_sha256: 7417e587fac65ec2cfef5d81e0b9325af23bb79eeeb6361107ae916f9eae52de
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
- passage_id: virtue-06
  group: virtue
  pair_id: null
  topic: mildhet
  text: Den mildes karaktär ligger mellan den hetsiges vrede och den likgiltiges frånvaro av gensvar.
    Upprördheten står i proportion till händelsens betydelse och dess sammanhang. Lugn och känslighet
    hör samman i denna hållning, med utrymme för både allvar och försoning. Ilskan är varken härskare
    eller främling i personens liv.
  text_sha256: 34171f7c08f448977dd9134a70f3d5a3891cf962f5e143615e7cb6047c4babb4
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
- passage_id: virtue-07
  group: virtue
  pair_id: null
  topic: självaktning
  text: Den självaktandes hållning ligger mellan den fåfänges uppblåsta självbild och den försagdes förminskning
    av sitt värde. Förhållandet till erkännande präglas av stadga. Andras uppskattning är betydelsefull
    utan att ensam bära personens uppfattning av sin egen förmåga. Självkännedomen förenar tillförsikt
    med ett klart sinne för begränsningar.
  text_sha256: 2a2262c40b0600c6cbda2c0c0d15e274e23bd6768fb1c32f42874cdbfdca38d1
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
- passage_id: virtue-08
  group: virtue
  pair_id: null
  topic: kvickhet
  text: Den kvickes karaktär ligger mellan gycklarens gränslösa skämtande och den sträves avstånd till
    lekfullhet. Humorn hör till en uppmärksam samvaro. Dess lätthet rymmer känsla för samtalets ton och
    för människorna i rummet, med en rörelse mellan allvar och avspänning. Skrattet uttrycker gemenskap
    och en blick för tillvarons motsägelser.
  text_sha256: 2ce9e865708d4ea3f7130d56b80a05eb476b13d8680a74805a06feeca2a0b87f
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
- passage_id: virtue-09
  group: virtue
  pair_id: null
  topic: ambition
  text: Den balanserat ambitiöses hållning ligger mellan den ärelystnes jakt på erkännande och den håglöses
    ointresse för förtjänst. Arbetets värde och den egna insatsen framträder i samma blick. Framgång har
    betydelse utan att fylla hela föreställningen om ett gott liv. Uthålligheten har sin grund i intresset
    för uppgiften och i känslan för dess plats i ett större sammanhang.
  text_sha256: c511cdff1056a7b3b8652510c0dd31458e7a5e5fe15250a8e37172f63f9eeef5
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
- passage_id: virtue-10
  group: virtue
  pair_id: null
  topic: storslagenhet
  text: Den storslagnes karaktär ligger mellan den pråliges uppvisning av rikedom och den småaktiges upptagenhet
    av varje utgift. Ett gemensamt företags betydelse ger form åt insatsen. Omsorgen gäller helhetens
    kvalitet och människornas deltagande, med sinne för proportioner. Storleken är förbunden med sammanhanget
    och dess värdighet. Det synliga resultatet uttrycker denna samlade blick.
  text_sha256: d50dc29dbfd439cc679ce8bbc01f9194281d13e0fd25baecf825df43cdac8a2a
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
- passage_id: categorical-01
  group: categorical
  pair_id: pair-01
  topic: löfte
  text: En löftesgivare ska hålla sitt löfte till mottagaren. Plikten avser fullgörandet av den handling
    som löftet uttrycker och inte enbart en försäkran om god vilja. Detta gäller utan undantag, oberoende
    av egen fördel och av andras önskemål.
  text_sha256: c3273759fe7d8067bbf89d003eb939e7a54c4b66f76b5f98b3ab3ddbe6aeb634
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
- passage_id: conditional-01
  group: conditional
  pair_id: pair-01
  topic: löfte
  text: En löftesgivare ska hålla sitt löfte till mottagaren. Plikten avser fullgörandet av den handling
    som löftet uttrycker och inte enbart en försäkran om god vilja. Detta gäller dock inte om löftets
    fullgörande medför allvarlig skada för mottagaren.
  text_sha256: 596921e82cab8adeb09c475bb22fbac92047619d4ba0d94e6d523bb8e57c5898
  source: constructed:2026-09-11; philosophical form, not quotation
