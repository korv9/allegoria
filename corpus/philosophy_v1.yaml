- passage_id: categorical-02
  group: categorical
  pair_id: pair-02
  topic: sann uppgift
  text: En uppgiftslämnare ska lämna sanningsenliga uppgifter till mottagaren. Plikten avser överensstämmelsen
    mellan uppgiften och det uppgiftslämnaren känner till, med samma krav på tal och skrift. Detta gäller
    utan undantag, oberoende av egen fördel och av andras önskemål.
  text_sha256: 49b2a39799dc5397d730a547ab63c15320f3d6ed284fffa6fb8ba16dd3305b23
  source: constructed:2026-09-11; philosophical form, not quotation
  review_note: Human philosophical and slot review pending.
