    Detta gäller dock inte om överlämnandet utsätter ägaren för en omedelbar fara.
  text_sha256: 813adef5a2741812fa70f03bab1f6b8e0d9b9b78bdced85a5aa1294e63ba9cb3
  source: constructed:2026-09-11; philosophical form, not quotation
