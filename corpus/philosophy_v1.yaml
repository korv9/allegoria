- passage_id: categorical-07
  group: categorical
  pair_id: pair-07
  topic: avtal
  text: En avtalspart ska fullgöra sitt frivilligt ingångna åtagande gentemot motparten. Plikten avser
    den överenskomna prestationen i dess helhet och inte enbart ett uttryck för fortsatt samarbetsvilja.
    Det frivilliga åtagandet binder den part som ingick avtalet. Detta gäller utan undantag, oberoende
    av egen fördel och av andras önskemål.
  text_sha256: 6f0c07d4cd9038476f85fb2fb4af896e6416913ab5c7b94b9bd87a2bee9e594c
  source: constructed:2026-09-11; philosophical form, not quotation
