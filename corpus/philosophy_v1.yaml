- passage_id: categorical-08
  group: categorical
  pair_id: pair-08
  topic: rättelse
  text: En intygsgivare ska rätta sin egen felaktiga uppgift till mottagaren. Plikten avser en rättelse
    som tydligt anger vilken uppgift som var oriktig och återger det förhållande som intyget beskriver.
    Rättelsen ingår i intygsgivarens ansvar för sitt eget uttalande. Detta gäller utan undantag, oberoende
    av egen fördel och av andras önskemål.
  text_sha256: a82bafbc5ecfd3efb98aa0b34c7b4c259b5472dcaad122c3bbdc09333d4adb38
  source: constructed:2026-09-11; philosophical form, not quotation
