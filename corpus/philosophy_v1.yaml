- passage_id: categorical-05
  group: categorical
  pair_id: pair-05
  topic: erkännande
  text: En uppdragstagare ska tillskriva medarbetaren dennes eget arbete. Plikten avser erkännandet av
    den faktiska arbetsinsatsen i presentationen av det gemensamma resultatet inför uppdragsgivaren. Erkännandet
    ingår i själva presentationen. Detta gäller utan undantag, oberoende av egen fördel och av andras
    önskemål.
  text_sha256: 4eec58f3d45a1e1d97ebb764632c5c2388833f930129f6dd5ad1df09ab3ecea1
  source: constructed:2026-09-11; philosophical form, not quotation
