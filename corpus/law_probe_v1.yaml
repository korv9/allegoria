        question: Finns en plikt att ta upp en tvist?
        kind: modality
        attaches_to: duty
        modality: binding
        quote: Nätmyndigheten ska ta upp en tvist
      - slot_id: scope
        question: Finns en avgränsning av vilka kostnader tvistprövningen avser?
