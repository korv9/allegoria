purpose: Source-anchored generation-one inspection, not a validated direction experiment.
# determinacy/modality are the DIRECTION.md baseline rungs, added as assistant
# drafts (see annotation_status). Draft principle: `specific` = a checkable
# numeric, enumerated or binary criterion; `vague` = an open-textured evaluative
# standard ("särskilda skäl", "andra särskilda omständigheter"). These are the
# rungs a change is measured against and need human review before any result.
passages:
  - passage_id: sfs-2026-1281:K10P10
