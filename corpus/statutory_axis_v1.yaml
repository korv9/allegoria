schema_version: 1
passages:
- passage_id: sfs-2026-1281:K10P10
  group: statutory
  topic: SFS
  text: 'Nätmyndigheten ska ta upp en tvist om vilka kostnader som ska debiteras enligt 6, 7 eller 9 §.


    En tvist ska dock inte prövas om ansökan om prövning har kommit in till nätmyndigheten senare än två
    år efter det att den systemansvariga skickat ett skriftligt ställningstagande till den berörda partens
    senaste kända adress.'
  text_sha256: a669cf97a92952ef4b239d2a5e0e0880cc4ef6b0710f72b038091840f8b85e6c
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2026-1281.html#K10P10
  review_note: 'The worked example DIRECTION.md argues from, and now demonstrably the right shape: the
    two-year limit sits in the qualifier itself, not in the duty, so it can fall specific → vague → absent.
    Best specimen in the set.'
- passage_id: sfs-2022-725:P47
  group: statutory
  topic: SFS
  text: Innan kontrollmyndigheten beslutar om sanktionsavgift ska den som avgiften ska tas ut av få tillfälle
    att yttra sig. Om så inte har skett inom två år från det att överträdelsen ägde rum får någon sanktionsavgift
    inte beslutas.
  text_sha256: 31d87518b2e631f567cfde32b61214a377b9472b9b1d30f6d4917bd5017374ba
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2022-725.html#P47
  review_note: Two sentences, one rule each, and the deadline is inside the condition. Missing it extinguishes
    the authority's power rather than excusing it, which is a useful check that direction follows structure
    and not who benefits.
- passage_id: sfs-2026-1281:K16P10
  group: statutory
  topic: SFS
  text: Konsumenten ska underrätta motparten om anspråk på ersättning enligt 6-8 §§ inom två år från det
    att skadan inträffade. Om konsumenten inte gör det, är rätten till ersättning för den uppkomna skadan
    förlorad.
  text_sha256: 8993194167c650f8bd7cf22cfa8944f1daed6018b6ecb89c9dbe587751660aa4
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2026-1281.html#K16P10
  review_note: 208 characters, one actor, one duty, one consequence. The two-year period is stated in
    the duty and referred back to by the condition, so annotation has to decide where the deadline slot
    lives -- a clean test of that call.
- passage_id: sfs-2026-723:P9
  group: statutory
  topic: SFS
  text: En sanktionsavgift får inte dömas ut om den misstänkte inte har fått ta del av åklagarens yrkande
    om sanktionsavgift inom fem år från den dag då uppgiften lämnades eller anmälningsskyldigheten uppkom.
  text_sha256: 07059d585900ff4b846176ad1d51ebb11add085047194615862fd88b8b342ac2
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2026-723.html#P9
  review_note: A prohibition whose entire content is a limitation period. Minimal and hard to separate
    duty from qualifier, which makes it a good stress case for the slot schema.
- passage_id: sfs-2018-1138:K4P8
  group: statutory
  topic: SFS
  text: 'En licens ska avse en viss tid och får, om inte annat anges i denna lag, ges för högst fem år.


    Om en ansökan om förnyelse av licensen har getts in senast fyra månader innan giltighetstiden för
    den gällande licensen går ut, ska licensen gälla till dess att spelmyndigheten beslutat om den nya
    ansökan. Lag (2022:1674).'
  text_sha256: dccf3cf35b0da881d6c2fdd7c1765bc5d4481517d5928a9b055eda73c3cbaf09
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2018-1138.html#K4P8
  review_note: 'Two deadlines doing different jobs: a duration cap in the duty and a filing cut-off in
    the qualifier. Good check that slots are distinguished by kind rather than by merely being numbers.'
- passage_id: sfs-2026-408:K8P7
  group: statutory
  topic: SFS
  text: Skjutvapen, ammunition och ljuddämpare som en person vid resa fört med till Sverige för personligt
    bruk men inte haft rätt att föra in, får föras ut om föremålen anmälts i behörig ordning till Tullverket.
    Om föremålen inte förs ut inom fyra månader efter en sådan anmälan eller inom den längre tid som Tullverket
    bestämmer, tillfaller föremålen staten och ska behandlas som om de hade förverkats.
  text_sha256: ebfc6fe2fda08caf9873a5a3d7d6ca4f2b4d0b4acfe4323ff61b69a1622e518c
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2026-408.html#K8P7
  review_note: The qualifier carries its own escape hatch -- “eller inom den längre tid som Tullverket
    bestämmer” -- so the deadline is specific but discretionarily extendable. A probe for whether the
    ladder handles a soft override.
- passage_id: sfs-2026-772:K7P1
  group: statutory
  topic: SFS
  text: 'En hyresvärd eller en hyresgäst som vill framställa fordringsanspråk på grund av ett hyresförhållande,
    ska väcka talan om detta inom två år från det att hyresgästen lämnade lägenheten. Görs det senare
    är rätten till talan förlorad, om inte annat har avtalats.


    Om den ena parten har väckt talan i rätt tid, har den andra parten rätt till kvittning, fastän hans
    eller hennes rätt till talan är förlorad.'
  text_sha256: 254e0ce95d91672572e775ba49037fa0007b11551fce9f9ad30d5c463d25b388
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2026-772.html#K7P1
  review_note: A limitation period that parties may contract out of, so the exception is an open renvoi
    to agreement rather than a substantive carve-out. Ordinary private-law shape, easy to twin.
- passage_id: sfs-2024-945:K15P12
  group: statutory
  topic: SFS
  text: 'Rätten till ersättning för skada preskriberas om talan inte väcks inom fem år från det att skadan
    uppkom.


    Första stycket gäller dock inte om talan om ersättning enligt

    11 § väcks senast ett år efter det att tiden för invändning har gått ut eller, om invändning har gjorts,
    senast ett år efter det att Patent- och registreringsverket beslutade att patentet ska upprätthållas.'
  text_sha256: 3a198785ae17fc8b98f21bd4099c52afb094aa91ff0324927f828e09b748cdaa
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2024-945.html#K15P12
  review_note: 'Both the rule and its exception carry their own specific deadline, five years against
    one year. Rare and valuable: qualifier death can be watched independently in two positions in the
    same passage.'
- passage_id: sfs-2025-400:K20P2
  group: statutory
  topic: SFS
  text: Om en anmälan till socialnämnden gäller barn eller unga, ska socialnämnden fatta beslut om att
    inleda eller inte inleda utredning inom fjorton dagar efter det att anmälan har kommit in (förhandsbedömning).
    Ett sådant beslut behöver dock inte fattas om det redan pågår en utredning om det barn eller den unge
    som anmälan avser. Tiden för förhandsbedömningen får endast förlängas om det finns synnerliga skäl.
  text_sha256: b0aff4967fabf13d4f6150d6064786e6155a63ec1b8120da8b94220625d643c2
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2025-400.html#K20P2
  review_note: A fourteen-day deadline, a `dock` carve-out, and a separate extension rule gated on `synnerliga
    skäl`. Three distinct moving parts, though the third makes it slightly busier than the specimens above.
- passage_id: sfs-2024-506:K5P8
  group: statutory
  topic: SFS
  text: 'När tiden med medlemskap eller anslutning beräknas enligt

    4 eller 5 § ska det bortses från avbrott i medlemskapet eller anslutningen som understiger en månad,
    om den sammanlagda avbrottstiden inte överstiger åtta veckor. Det gäller dock inte avbrott till följd
    av ett beslut om uteslutning enligt

    37 § lagen (1997:239) om arbetslöshetskassor.'
  text_sha256: af41c4be63be8149af63c2f15845f62d9f29c025a4b58690140e29b757ba8bcc
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2024-506.html#K5P8
  review_note: The qualifier is a cumulative cap on an aggregate, not a deadline, which broadens the kinds
    of specific qualifier the corpus covers beyond time limits.
- passage_id: sfs-2026-1358:K1P10
  group: statutory
  topic: SFS
  text: 'En e-legitimation ska utfärdas med en giltighetstid om fem år. Om sökanden inte har fyllt tolv
    år ska giltighetstiden vara tre år.


    Regeringen eller den myndighet som regeringen bestämmer får meddela föreskrifter om att den statliga
    e-legitimationen i särskilt angivna fall ska ha en kortare giltighetstid.'
  text_sha256: e4a6c6d6fa06c095923f21d70b405abab0e1a07c0a944cb16313873c027715fb
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2026-1358.html#K1P10
  review_note: The qualifier substitutes one specific value for another rather than switching the rule
    off, so it exercises the ladder's `strengthened` direction, which most specimens here cannot.
- passage_id: sfs-2024-7:P8
  group: statutory
  topic: SFS
  text: 'Ett vistelseförbud ska gälla för en viss tid, högst sex månader.


    Vistelseförbudet gäller omedelbart, om inte annat beslutas.


    Ett vistelseförbud får förlängas med högst sex månader i taget om förutsättningarna i 3-5 §§ är uppfyllda.
    Ett förbud med villkor om elektronisk övervakning får dock förlängas med högst tre månader i taget.'
  text_sha256: fe88e765f66cb1629205f5be4672c9173c440a1bd178a1c25aecb2e1ecbeac4e
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2024-7.html#P8
  review_note: 'Flagged `ceiling?`: the `dock` clause lowers the cap on a granted power from six months
    to three, rather than carving cases out of a duty. If it were annotated as an exception the derivation
    rule would return the wrong sign.'
- passage_id: sfs-2026-786:K10P20
  group: statutory
  topic: SFS
  text: 'Den som i en nordisk stat dömts till ett fängelsestraff får utan tillstånd transporteras genom
    Sverige till en annan nordisk stat för verkställighet av straffet.


    Om det är nödvändigt för att transporten ska kunna genomföras, får Polismyndigheten hålla den som
    överförs i förvar, dock längst under 48 timmar.'
  text_sha256: 3172c3b30c05784ebb1e2398b38109d7b0314ea2cd86755727b5375649e0d64c
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2026-786.html#K10P20
  review_note: Flagged `ceiling?` -- “dock längst under 48 timmar” bounds how far a power reaches, it
    does not remove cases from a duty. Removing it would leave detention unbounded, which is `loosening`,
    the opposite of removing an exception.
- passage_id: sfs-2026-1283:K2P6
  group: statutory
  topic: SFS
  text: 'Prövningsmyndigheten får, om det finns särskilda skäl, medge att


    1. en starkströmsledning eller en transformator- eller kopplingsstation byggs innan det finns en nätkoncession,
    och


    2. starkströmsledningen, när den är färdig att tas i bruk, används i avvaktan på att koncessionsfrågan
    slutligt avgörs, dock under högst tre år.'
  text_sha256: af36299bfcb09c1ae83211f564d8ccc2dc4aaaf7e789a7999c2289f295474a7f
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2026-1283.html#K2P6
  review_note: 'Flagged `ceiling?`. Also the clearest case of the A2 defect in the old sheet: it reported
    `specific` on “tre år”, but that figure is the ceiling, while the qualifier “om det finns särskilda
    skäl” is not checkable at all.'
- passage_id: sfs-2026-1601:K6P8
  group: statutory
  topic: SFS
  text: 'Ett barn eller en ung person som omfattas av bestämmelserna i 1 § får, i den utsträckning det
    är lämpligt, vistas utanför det särskilda ungdomshemmet under en på förhand bestämd tid, dock högst
    fyra veckor.


    Innan beslut fattas ska samråd ske med socialnämnden.'
  text_sha256: 2fbaa867c57b0f498e97069c5e55d54de407b1679f3f079ff3178227ab31a89c
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2026-1601.html#K6P8
  review_note: 'Flagged `ceiling?`. A vague qualifier guarding a specific ceiling: the permission is gated
    on `lämpligt`, which cannot be tested, while the four-week cap can. Watch which of the two dies first.'
- passage_id: sfs-2022-700:K3P9
  group: statutory
  topic: SFS
  text: '/Upphör att gälla U:2027-03-01/

    En utlänning som inte har fyllt 18 år får inte hållas i förvar längre tid än 72 timmar. Om det finns
    synnerliga skäl får utlänningen dock hållas i förvar under ytterligare 72 timmar.'
  text_sha256: ce4ba22da642253cbfd0c0c93cc34c5571dd884a7645539cef05da4dc546596a
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2022-700.html#K3P9
  review_note: '**Content risk, lower intensity than the passage dropped from this sheet:** immigration
    detention of minors. A model may hedge, and hedging would register as degradation. Keep, but read
    its generations for refusal artifacts before trusting them. Computed `qualifier_determinacy` says
    `specific`; that is the span heuristic swallowing the ceiling, since no comma separates condition
    from consequent.'
- passage_id: sfs-1982-673:P12
  group: statutory
  topic: SFS
  text: Alla arbetsgivare som anlitar arbetstagare till arbete annat än tillfälligt skall lämna arbetstagarna
    besked om ändringar i fråga om den ordinarie arbetstidens och jourtidens förläggning minst två veckor
    i förväg. Sådant besked får dock lämnas kortare tid i förväg, om verksamhetens art eller händelser
    som inte har kunnat förutses ger anledning till det.
  text_sha256: 44fef55b06ade8d33139ab3f7202262e1a6bee667d5bfc797c1842e77e4bb14e
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-1982-673.html#P12
  review_note: 'Structurally the closest thing to the founding rest-period example. Computed `qualifier_determinacy`
    says `specific`, but that is wrong: the two weeks sit in the duty and a prepositional `i fråga om`
    opened a span that reached them. The qualifier itself is not checkable.'
- passage_id: sfs-1977-480:P12
  group: statutory
  topic: SFS
  text: Om inte annat har avtalats, ska semesterledigheten förläggas så, att arbetstagaren får en ledighetsperiod
    av minst fyra veckor under juni-augusti. Även utan stöd av avtal får en sådan semesterperiod förläggas
    till annan tid, när särskilda skäl föranleder det. Lag (2009:1439).
  text_sha256: cf52f16f2d47e65cb7d9db9cfd0a0f5fe293abb30dd0439dda0d5879b8659030
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-1977-480.html#P12
  review_note: 'Kept for a structural reason rather than a determinacy one: it carries a qualifier in
    BOTH positions, `Om inte annat har avtalats` on the duty and `när särskilda skäl` on the exception,
    so one passage exercises both halves of the derivation rule.'
- passage_id: sfs-2019-742:K10P6
  group: statutory
  topic: SFS
  text: I fråga om uppdragstid för revisorn ska ett tjänstepensionsaktiebolag anses som ett sådant aktiebolag
    som avses i 9 kap. 21 a § aktiebolagslagen (2005:551). Möjligheten enligt den paragrafen att förlänga
    revisionsuppdraget till högst tjugo eller tjugofyra år gäller dock inte uppdrag i ett tjänstepensionsaktiebolag.
  text_sha256: 1b374165faaa35b2b1241072f79acb75ce8136f3e9740dd7ca33eabfcc71ffe4
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2019-742.html#K10P6
  review_note: '**Hidden cost, visible here at selection time:** the rule works by cross-reference, so
    twinning it means inventing the referenced statute too — a second fictional text that must stay consistent
    across every generation. Budget for that before choosing it.'
- passage_id: sfs-2026-578:P19
  group: statutory
  topic: SFS
  text: 'Marknadsstörningsavgift ska betalas till Konkurrensverket inom 30 dagar från det att beslutet
    fick laga kraft eller inom den längre tid som anges i beslutet.


    Om marknadsstörningsavgiften inte betalas i tid, ska Konkurrensverket lämna den obetalda avgiften
    för indrivning enligt lagen (1993:891) om indrivning av statliga fordringar m.m.'
  text_sha256: fbeb14528638c214794a86b6b3228deb6c61ea4df3c9c03635610cea5260392c
  source: review/2026-09-11/SPECIMENS.md
  source_sha256: 47da08411fa9f268e3370e12ddba5d3239c20e5a651f1bdaa975ae41906e320f
  source_url: https://data.riksdagen.se/dokument/sfs-2026-578.html#P19
  review_note: '**Negative control, kept deliberately and still saying so.** On a close reading the second
    sentence is a consequence of breach, not an exception to the duty. If hand annotation files it as
    an exception, the schema is too permissive.'
